<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfil de Mascota - PetCare Planner</title>
    <link rel="stylesheet" href="../assets/css/styles.css">
    <link rel="stylesheet" href="../assets/css/perfil.css">
</head>
<body>
    <header>
        <nav>
            <a href="../index.html"><strong>PetCare Planner</strong></a>
            <ul>
                <li><a href="../index.html">Inicio</a></li>
                <li><a href="agenda.html">Agenda de Cuidados</a></li>
                <li><a href="perfil.html" aria-current="page">Perfil de Mascota</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section id="perfil-seccion" class="registro-layout">
            
            <section class="panel-formulario">
                <h2>Registrar Mascota</h2>
                
                <form id="form-registro-mascota" class="pet-form">
                    <fieldset class="form-group-fieldset">
                        <legend class="visually-hidden">Datos de la nueva mascota</legend>
                        
                        <div class="form-field">
                            <label for="pet-nombre">Nombre</label>
                            <input type="text" id="pet-nombre" name="pet-nombre" required>
                        </div>

                        <div class="form-field">
                            <label for="pet-especie">Especie</label>
                            <select id="pet-especie" name="pet-especie" required>
                                <option value="" disabled selected>Seleccionar especie</option>
                                <option value="perro">Perro</option>
                                <option value="gato">Gato</option>
                                <option value="exotico">Exótico / Otro</option>
                            </select>
                        </div>

                        <div class="form-field">
                            <label for="pet-notas">Notas médicas / Algunas notas</label>
                            <textarea id="pet-notas" name="pet-notas" rows="3" placeholder="Ej. qué comida come, alergias, cuidados especiales"></textarea>
                        </div>

                        <div class="form-field">
                            <label for="pet-nacimiento">Fecha de Nacimiento</label>
                            <input type="date" id="pet-nacimiento" name="pet-nacimiento" required>
                        </div>

                        <div class="form-field">
                            <label for="pet-peso">Peso (kg)</label>
                            <input type="number" id="pet-peso" name="pet-peso" step="0.1" min="0" placeholder="Ej: 4.2" required>
                        </div>

                        <div class="form-field">
                            <label for="pet-imagen">Agregar Foto</label>
                            <input type="file" id="pet-imagen" name="pet-imagen" accept="image/*">
                        </div>

                        <button type="submit" class="primary-action btn-submit-registro">Agregar Mascota</button>
                    </fieldset>
                </form>
            </section>

            <aside class="panel-lista-mascotas">
                <h2>Tus compañeros registrados</h2>
                
                <ul id="lista-mascotas-container" class="mascotas-grid">
                    
                    <li>
                        <article class="mascota-card">
                            <figure class="mascota-avatar">
                                <span aria-hidden="true">🐾</span>
                            </figure>
                            <section class="mascota-info">
                                <h3>Luna</h3>
                                <p>Especie: Gato</p>
                                <p>Edad: 3 años</p>
                            </section>
                        </article>
                    </li>

                    <li>
                        <article class="mascota-card">
                            <figure class="mascota-avatar">
                                <span aria-hidden="true">🐾</span>
                            </figure>
                            <section class="mascota-info">
                                <h3>Max</h3>
                                <p>Especie: Perro</p>
                                <p>Edad: 5 años</p>
                            </section>
                        </article>
                    </li>

                </ul>
            </aside>

        </section>
    </main>

    <footer>
        <p>&copy; 2026 PetCare Planner - Proyecto Integrador - Grupo 9</p>
    </footer>
    <script src="../assets/js/main.js"></script>
    <script src="../assets/js/perfil.js"></script>
</body>
</html>
